spring:
  datasource:
    url: jdbc:h2:mem:batch_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

jwt:
  secret: test-jwt-secret-key-for-batch-management-project-1234567890
  expiration: 1800000

slack:
  webhook-url: