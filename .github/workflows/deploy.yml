name: Batch Management CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Backend / Frontend Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: batch_management_test
          MYSQL_USER: batchtest
          MYSQL_PASSWORD: batchtest1234
          MYSQL_ROOT_PASSWORD: root1234
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Backend test
        run: ./gradlew clean test --no-daemon
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/batch_management_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
          SPRING_DATASOURCE_USERNAME: batchtest
          SPRING_DATASOURCE_PASSWORD: batchtest1234

          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          SPRING_JPA_SHOW_SQL: "false"
          SPRING_BATCH_JDBC_INITIALIZE_SCHEMA: always

          JWT_SECRET: ci-test-jwt-secret-key-for-batch-management-123456789
          SLACK_WEBHOOK_URL: ""

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Backend Docker build
        run: docker build -t batch-management-backend .

      - name: Frontend Docker build
        run: docker build -t batch-management-frontend ./frontend

  deploy:
    name: Deploy to EC2
    needs: test
    runs-on: self-hosted

    steps:
      - name: Deploy application
        run: |
          set -e

          cd /home/ec2-user/batch-management

          git pull origin main

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            up -d --build

          docker image prune -f

          docker compose \
          --env-file .env.prod \
          -f docker-compose.prod.yml \
          ps