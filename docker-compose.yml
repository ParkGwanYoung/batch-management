services:

  # =========================================================
  # MySQL
  # =========================================================
  mysql:
    image: mysql:8.0
    container_name: batch-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  # =========================================================
  # Spring Boot
  # =========================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: batch-backend

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/batch_management?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      # 로컬 개발 환경
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_BATCH_JDBC_INITIALIZE_SCHEMA: always

      JWT_SECRET: ${JWT_SECRET}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}

    ports:
      - "8080:8080"

    depends_on:
      mysql:
        condition: service_healthy


  # =========================================================
  # React + Nginx
  # =========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: batch-frontend

    ports:
      - "80:80"

    depends_on:
      - backend


volumes:
  mysql_data: